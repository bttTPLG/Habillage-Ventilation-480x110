<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Habillage</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Kanit:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />

    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #ffffff;
        overflow: hidden;
      }

      /* Wrapper global centré */
      .wrapper {
        width: 100%;
        max-width: 1024px;
        height: 100;
        margin: 0 auto;
        display: flex;
        justify-content: center;
        box-sizing: border-box;
        position: relative;
        background-color: #e30713;
        font-family: "Kanit", sans-serif;
      }

      .background-image {
        width: 100%;
        height: 100%;
        object-fit: cover;
        position: absolute;
        top: 0;
        left: 0;
      }

      .TPLG-mid {
        position: relative;
        flex: 0 0 480px;
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
        align-items: center;
        height: 250px;
        z-index: 2;
      }

      .TPLG-mid .logo-title-container {
        width: 100%;
        height: fit-content;
        padding: 10px 10px 0 10px;
        box-sizing: border-box;
        display: flex;
        flex-direction: row;
        justify-content: space-between;
        align-items: center;
      }

      .TPLG-mid .sticker,
      .TPLG-mid .logo-title-container .txt1 {
        opacity: 0;
        animation: alternance 2s infinite;
      }

      .TPLG-mid .sticker {
        position: absolute;
        height: 100px;
        top: 0;
        right: 10px;
        animation-delay: 0s;
      }

      .TPLG-mid .logo-title-container .txt1 {
        font-size: 40px;
        text-align: right;
        font-weight: bold;
        color: white;
        margin: 0;
        line-height: 80%;
        animation-delay: 1s;
      }

      @keyframes alternance {
        0%,
        5% {
          opacity: 0;
        }

        15%,
        40% {
          opacity: 1;
        }

        50%,
        100% {
          opacity: 0;
        }
      }

      .TPLG-mid .logo-title-container .txt2 {
        font-size: 32px;
      }

      .TPLG-mid .carousel-text-container {
        position: relative;
        width: 100%;
        height: 100%;
        padding: 0 20px 10px 20px;
        box-sizing: border-box;
        animation: rotateText 20s infinite;
        animation-timing-function: ease-in-out;
      }

      .TPLG-mid .carousel-text-container > div {
        position: absolute;
        inset: 0;
        opacity: 0;
        animation: carousel 12s infinite;
      }

      @keyframes carousel {
        0%,
        25% {
          opacity: 1;
        }

        25.01%,
        100% {
          opacity: 0;
        }
      }

      .TPLG-mid .carousel-text-container .slide-1 {
        position: relative;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        animation-delay: 0s !important;
      }

      .TPLG-mid .carousel-text-container .slide-1 p {
        font-size: 36px;
        text-align: center;
        font-weight: bold;
        line-height: 100%;
        margin: 0;
        color: #f2ff00;
      }

      .TPLG-mid .carousel-text-container .slide-2 {
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        animation-delay: 3s !important;
      }

      .TPLG-mid .carousel-text-container .slide-2 p {
        font-size: 36px;
        text-align: center;
        font-weight: bold;
        line-height: 100%;
        margin: 0;
        color: white;
      }

      .TPLG-mid .carousel-text-container .slide-3 {
        width: 100%;
        height: 100%;
        display: grid;
        grid-template-columns: 1fr 1fr;
        column-gap: 20px;
        animation-delay: 6s !important;
      }

      .TPLG-mid .carousel-text-container .slide-3 .produit {
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: row;
        justify-content: end;
        align-items: center;
      }

      .TPLG-mid .carousel-text-container .slide-3 .produit .txt1 {
        color: white;
        font-size: 36px;
        font-weight: bold;
        text-align: right;
        line-height: 80%;
        margin: 0;
      }

      .TPLG-mid .carousel-text-container .slide-3 .produit .txt2 {
        font-size: 24px;
      }

      .TPLG-mid .carousel-text-container .slide-3 .prix {
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        position: relative;
        align-items: flex-start;
        justify-content: center;
      }

      .TPLG-mid .carousel-text-container .slide-3 .prix .txt3 {
        color: #f2ff00;
        font-size: 36px;
        font-weight: bold;
        text-align: left;
        line-height: 120%;
        margin: 0;
      }

      .TPLG-mid .carousel-text-container .slide-3 .prix .txt4 {
        font-size: 64px;
      }

      .TPLG-mid .carousel-text-container .slide-3 .prix .txt5 {
        font-size: 17px;
        color: white;
        position: absolute;
        top: 120px;
        margin: 0;
      }

      .TPLG-mid .carousel-text-container .slide-4 {
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        animation-delay: 9s !important;
      }

      .TPLG-mid .carousel-text-container .slide-4 p {
        margin: 0;
        color: white;
        font-size: 32px;
        font-weight: bold;
      }

      .TPLG-left,
      .TPLG-right {
        position: relative;
        z-index: 2;
        display: flex;
        flex-direction: column;
        flex: 0 0 272px;
        box-sizing: border-box;
      }

      .TPLG-left,
      .TPLG-right {
        justify-content: center;
        align-items: center;
      }

      /* -------------------  Carousel Text --------------- */
      .TPLG-text-carousel-container {
        margin: 0;
        width: 100%;
        padding: 0;
        height: 100%;
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        box-sizing: border-box;
      }

      .TPLG-LOGO {
        height: 76px;
      }

      .TPLG-global-link {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 5;
      }
    </style>
  </head>

  <body>
    <div class="wrapper">
      <a
        href="https://www.toutpourlegrain.fr/fr/contact"
        target="_blank"
        class="TPLG-global-link"
      ></a>
      <img
        src="https://raw.githubusercontent.com/bttTPLG/img/refs/heads/main/asset/Ventilation-fond-1024x250.png"
        class="background-image"
      />
      <!-- Gauche -->
      <section class="TPLG-left"></section>

      <!-- Milieu -->
      <section class="TPLG-mid">
        <div class="logo-title-container">
          <img
            src="https://raw.githubusercontent.com/bttTPLG/img/eb099beebfb05c3c7642433b39c5e27d81cc5bd9/asset/Logo-TPLG-blanc-2.svg"
            alt="Logo Tout Pour Le Grain"
            class="TPLG-LOGO"
          />
          <img
            src="https://raw.githubusercontent.com/bttTPLG/img/refs/heads/main/asset/sticker.png"
            alt="Destockage fin d'année"
            class="sticker"
          />
          <p class="txt1">
            Caniveau <br />
            <span class="txt2">de ventilation</span>
          </p>
        </div>
        <div class="carousel-text-container">
          <div class="slide-1">
            <p>
              OFFRE <br />
              EXCEPTIONNELLE !
            </p>
          </div>

          <div class="slide-2">
            <p>
              ÉTUDE <br />
              SUR-MESURE
            </p>
          </div>

          <div class="slide-3">
            <div class="produit">
              <p class="txt1">
                Caniveau <br />
                + grille<br />
                <span class="txt2">renforcée</span>
              </p>
            </div>
            <div class="prix">
              <p class="txt3">
                A partir de <br />
                <span class="txt4">35€/m</span><br />
              </p>
              <p class="txt5">suivant stock disponible</p>
            </div>
          </div>

          <div class="slide-4">
            <p>Demandez votre devis !</p>
          </div>
        </div>

        <!-- Carousel text -->
        <div class="TPLG-text-carousel-container"></div>
      </section>

      <!-- Droite -->
      <section class="TPLG-right"></section>
    </div>
  </body>
</html>
