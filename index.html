<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Habillage</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Kanit:wght@100;200;300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />

    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #ffffff;
        overflow: hidden;
      }

      .wrapper {
        width: 100%;
        max-width: 480px;
        height: 110px;
        margin: 0 auto;
        display: flex;
        justify-content: center;
        box-sizing: border-box;
        position: relative;
        background-color: #e30713;
        font-family: "Kanit", sans-serif;
      }

      .background-image {
        width: 100%;
        height: 100%;
        object-fit: cover;
        position: absolute;
        top: 0;
        left: 0;
      }

      .TPLG-mid {
        position: relative;
        flex: 0 0 320px;
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
        align-items: center;
        height: 110px;
        z-index: 2;
      }

      /* LOGO : visible de 0 à 3 secondes */
      .TPLG-mid .logo-title-container {
        width: 100%;
        min-height: 110px;
        padding: 10px;
        box-sizing: border-box;
        display: flex;
        justify-content: center;
        align-items: center;
        position: absolute;
        top: 0;
        left: 0;
        overflow: hidden;
        animation: afficher-logo 15s infinite;
      }

      @keyframes afficher-logo {
        0%,
        19.99% {
          opacity: 1;
          visibility: visible;
        }

        20%,
        100% {
          opacity: 0;
          visibility: hidden;
        }
      }

      .TPLG-mid .logo-title-container .TPLG-LOGO {
        height: 76px;
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        animation: entree-sortie 3s ease-in-out infinite;
      }

      @keyframes entree-sortie {
        0% {
          top: -76px;
          opacity: 0;
        }

        25% {
          top: 15px;
          opacity: 1;
        }

        75% {
          top: 15px;
          opacity: 1;
        }

        100% {
          top: 110px;
          opacity: 0;
        }
      }

      /* CARROUSEL : visible de 3 à 15 secondes */
      .TPLG-mid .carousel-text-container {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        padding: 10px;
        box-sizing: border-box;
        animation: afficher-carrousel 15s infinite;
      }

      @keyframes afficher-carrousel {
        0%,
        19.99% {
          opacity: 0;
          visibility: hidden;
        }

        20%,
        99.99% {
          opacity: 1;
          visibility: visible;
        }

        100% {
          opacity: 0;
          visibility: hidden;
        }
      }

      .TPLG-mid .carousel-text-container .sticker {
        opacity: 0;
        animation: alternance 1.5s infinite;
      }

      .TPLG-mid .carousel-text-container .sticker {
        position: absolute;
        height: 50px;
        top: 0;
        right: 10px;
        animation-delay: 0s;
      }

      @keyframes alternance {
        0%,
        5% {
          opacity: 0;
        }

        15%,
        40% {
          opacity: 1;
        }

        50%,
        100% {
          opacity: 0;
        }
      }

      /* Chaque slide occupe 3 secondes */
      .TPLG-mid .carousel-text-container > div {
        position: absolute;
        inset: 0;
        opacity: 0;
        animation: carousel 15s infinite;
      }

      @keyframes carousel {
        0%,
        19.99% {
          opacity: 1;
        }

        20%,
        100% {
          opacity: 0;
        }
      }

      .TPLG-mid .carousel-text-container .slide-1 {
        position: relative;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: end;
        animation-delay: 3s;
        box-sizing: border-box;
        padding-bottom: 10px;
      }

      .TPLG-mid .carousel-text-container .slide-1-2 {
        position: relative;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        animation-delay: 0s;
      }

      .TPLG-mid .carousel-text-container .slide-1 p {
        font-size: 20px;
        text-align: center;
        font-weight: bold;
        line-height: 100%;
        margin: 0;
        color: #f2ff00;
      }

      .TPLG-mid .carousel-text-container .slide-2 {
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: end;
        animation-delay: 9s;
        box-sizing: border-box;
        padding-bottom: 20px;
      }

      .TPLG-mid .carousel-text-container .slide-2 p {
        font-size: 20px;
        text-align: center;
        font-weight: bold;
        line-height: 100%;
        margin: 0;
        color: white;
      }

      .TPLG-mid .carousel-text-container .slide-3 {
        width: 100%;
        height: 100%;
        display: grid;
        grid-template-columns: 1fr 1fr;
        column-gap: 10px;
        animation-delay: 6s;
        padding-bottom: 20px;
        box-sizing: border-box;
      }

      .TPLG-mid .carousel-text-container .slide-3 .produit {
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: row;
        justify-content: end;
        align-items: end;
      }

      .TPLG-mid .carousel-text-container .slide-3 .produit .txt1 {
        color: white;
        font-size: 20px;
        font-weight: bold;
        text-align: right;
        line-height: 80%;
        margin: 0;
      }

      .TPLG-mid .carousel-text-container .slide-3 .produit .txt2 {
        font-size: 13.3px;
      }

      .TPLG-mid .carousel-text-container .slide-3 .prix {
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        position: relative;
        align-items: flex-start;
        justify-content: end;
      }

      .TPLG-mid .carousel-text-container .slide-3 .prix .txt3 {
        color: #f2ff00;
        font-size: 20px;
        font-weight: bold;
        text-align: left;
        line-height: 120%;
        margin: 0;
      }

      .TPLG-mid .carousel-text-container .slide-3 .prix .txt4 {
        font-size: 35.5px;
      }

      .TPLG-mid .carousel-text-container .slide-3 .prix .txt5 {
        font-size: 9.44px;
        color: white;
        position: absolute;
        top: 85px;
        margin: 0;
      }

      .TPLG-mid .carousel-text-container .slide-4 {
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: end;
        animation-delay: 12s;
        padding-bottom: 20px;
        box-sizing: border-box;
      }

      .TPLG-mid .carousel-text-container .slide-4 p {
        margin: 0;
        color: white;
        font-size: 17.77px;
        font-weight: bold;
      }

      .TPLG-left,
      .TPLG-right {
        position: relative;
        z-index: 2;
        display: flex;
        flex-direction: column;
        flex: 0 0 80px;
        box-sizing: border-box;
        justify-content: center;
        align-items: center;
      }

      .TPLG-text-carousel-container {
        margin: 0;
        width: 100%;
        padding: 0;
        height: 100%;
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        box-sizing: border-box;
      }

      .TPLG-global-link {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 5;
      }
    </style>
  </head>

  <body>
    <div class="wrapper">
      <img
        src="https://raw.githubusercontent.com/bttTPLG/img/refs/heads/main/asset/Ventilation-fond-1024x250.png"
        class="background-image"
        alt=""
      />
      <a
        href="https://www.toutpourlegrain.fr/fr/contact"
        target="_blank"
        class="TPLG-global-link"
      ></a>

      <section class="TPLG-left"></section>

      <section class="TPLG-mid">
        <div class="logo-title-container">
          <img
            src="https://raw.githubusercontent.com/bttTPLG/img/eb099beebfb05c3c7642433b39c5e27d81cc5bd9/asset/Logo-TPLG-blanc-2.svg"
            alt="Logo Tout Pour Le Grain"
            class="TPLG-LOGO"
          />
        </div>

        <div class="carousel-text-container">
          <img
            src="https://raw.githubusercontent.com/bttTPLG/img/refs/heads/main/asset/sticker.png"
            alt="Destockage fin d'année"
            class="sticker"
          />
          <div class="slide-1">
            <p>
              OFFRE <br />
              EXCEPTIONNELLE !
            </p>
          </div>
          <div class="slide-1-2">
            <p>
              OFFRE <br />
              EXCEPTIONNELLE !
            </p>
          </div>

          <div class="slide-2">
            <p>
              ÉTUDE <br />
              SUR-MESURE
            </p>
          </div>

          <div class="slide-3">
            <div class="produit">
              <p class="txt1">
                Caniveau <br />
                + grille<br />
                <span class="txt2">renforcée</span>
              </p>
            </div>

            <div class="prix">
              <p class="txt3">
                A partir de <br />
                <span class="txt4">37€/m</span><br />
              </p>
              <p class="txt5">suivant stock disponible</p>
            </div>
          </div>

          <div class="slide-4">
            <p>Demandez votre devis !</p>
          </div>
        </div>
      </section>

      <section class="TPLG-right"></section>
    </div>
  </body>
</html>
